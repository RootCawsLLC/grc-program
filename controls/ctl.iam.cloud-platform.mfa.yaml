control_id: ctl.iam.cloud-platform.mfa
title: MFA and no long-lived static credentials on AWS production account principals
layer: cloud-platform
owner: platform-engineering
status: building

faircam:
  - { function: resistance, primary: true }
  - { function: provide-asset-data, primary: false }

population_definition: >
  All IAM principals in every AWS account in the production organization that can authenticate
  interactively or hold a long-lived access key — IAM users, roles assumable by a human principal,
  and root. Federated roles assumed via the enterprise IdP inherit ctl.iam.enterprise-sso.mfa and
  are counted here only for the static-key half of the test.
source_system: aws
query_ref: models/controls/ctl_iam_cloud_platform_mfa.sql

collection:
  cadence: daily
  mechanism: api
  variance_started_at_quality: source-timestamp

crosswalk:
  scf: [IAC-06, IAC-15]
  soc2: [CC6.1, CC6.3]
  iso27001_2022: [A.8.2, A.8.5]
  nist80053r5: ["IA-2(1)", "AC-6(5)", "IA-5(1)"]
  csf2: [PR.AA-03, PR.AA-05]

scenarios: [scn.cred-theft.cloud-admin]
policy_ref: null
cost: { capex: 0, opex_annual: 0, basis: "PLACEHOLDER — see ctl.iam.enterprise-sso.mfa" }

notes: >
  Evidence source is the AWS IAM credential report plus Organizations account enumeration. This is
  a first-cycle target: unambiguous denominator, API-accessible, high scenario weight.
