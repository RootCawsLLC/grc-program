name: continuous-controls-monitoring

# The operating heartbeat. A one-person program does not survive a manual collection step.
#
# Action pins verified 2026-08-27 — see the note in ci.yml.
#
# Sequence: collect full state -> load time-indexed -> build assertions -> compute variance ->
# route exceptions -> emit OSCAL -> push to Scytale.
#
# Note the ordering: Scytale is LAST and it is a push. This repo produces the evidence; Scytale
# renders it for the auditor. See docs/adr/0001-scytale-is-a-sink.md.

# SCHEDULE DISABLED until the pipeline this file describes actually exists. See issue #5.
#
# Four of the five commands below are not implemented: `collect`, `assert`, `drift` and `route` are
# absent from src/cli.mjs, which defines only validate, intake, health, gap, oscal, push, probe,
# simulate, baseline and help. The collectors are written against injected clients and have never
# run against a live tenant (BUILD-ORDER B2 is "Blocked on: the OIDC role"; B5's IdP is still the
# placeholder <IdP>). Every scheduled run since 2026-08-23 has failed, and every one of them would
# still fail with the credentials restored — just at a later step.
#
# It is switched off rather than left red because a monitor that cries wolf daily from before it
# was built is worse than one that is off: the first real failure looks identical to the thirty
# fake ones preceding it, and by then nobody opens the mail. `workflow_dispatch` stays so the job
# can still be exercised deliberately.
#
# Restore the schedule when `collect` exists and a manual dispatch has run green once:
#   schedule:
#     - cron: '0 6 * * *'   # 06:00 UTC daily, ahead of the US working day
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write         # OIDC to AWS. No long-lived keys in this pipeline — the pipeline that
                          # measures ctl.iam.cloud-platform.mfa does not get to violate it.

concurrency:
  group: ccm
  cancel-in-progress: false   # never cancel a partial collection; a truncated population is a lie

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.CCM_READONLY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Collect full state
        env:
          IDP_TOKEN: ${{ secrets.IDP_READONLY_TOKEN }}
          GH_TOKEN: ${{ secrets.GRC_READONLY_TOKEN }}
        run: node src/cli.mjs collect --all

      - name: Build assertions and variance
        run: node src/cli.mjs assert

      # Denominator drift is checked BEFORE failures are routed. A population that silently
      # shrank makes the pass rate improve while coverage gets worse, and routing failures first
      # buries that signal under a list of tickets.
      - name: Denominator drift check
        run: node src/cli.mjs drift --tolerance 0.10

      - name: Route exceptions
        run: node src/cli.mjs route

      - name: Emit OSCAL assessment results
        run: npm run oscal

      - name: Push to Scytale
        env:
          SCYTALE_TOKEN: ${{ secrets.SCYTALE_TOKEN }}
          SCYTALE_URL: ${{ secrets.SCYTALE_CUSTOM_INTEGRATION_URL }}
        # Stays dry-run until the Custom Integration JSON contract is confirmed against the UI.
        # A guessed schema produces silently wrong evidence in the auditor-facing system, which is
        # strictly worse than no evidence. src/push/scytale.mjs refuses to send until then.
        run: node src/cli.mjs push

      # NOTHING IS COMMITTED BACK, DELIBERATELY. There used to be a "Commit the evidence record"
      # step here that ran `git add out/ evidence/`, committed as ccm-bot, and pushed. It could
      # never have worked — `out/` is gitignored, `evidence/` has never existed, and the job holds
      # a read-only token — so it staged nothing, short-circuited on `git diff --staged --quiet`,
      # and exited 0 every time. See #7.
      #
      # It was removed rather than repaired, because making it work would have broken two things
      # this repository decided on purpose:
      #
      #   1. A bot pushing to main bypasses the control. "A pull request is the only path to
      #      normative. A human merges. The merge is the control." A scheduled job committing
      #      auditor-facing artifacts straight to the default branch is exactly what that rule
      #      exists to prevent, and it would need contents: write to do it.
      #   2. Git is not the evidence store. Control definitions, exceptions and scenarios are
      #      normative and live here. Evidence is a time-indexed, snapshotted warehouse (B1/B22);
      #      `out/` is a build product and gitignored on purpose. Committing it would duplicate
      #      the warehouse in a medium that cannot answer "what was true on 14 March".
      #
      # Where a run's evidence goes instead: OSCAL assessment results to `out/` for this job, and
      # onward to Scytale by push, per ADR-0001. Making that survive the runner is warehouse work
      # (B1/B22), not a git push from CI — and it is still open. Do not solve it by re-adding a
      # commit step.
