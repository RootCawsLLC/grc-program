name: continuous-controls-monitoring

# The operating heartbeat. A one-person program does not survive a manual collection step.
#
# Action pins verified 2026-08-21 — see the note in ci.yml.
#
# Sequence: collect full state -> load time-indexed -> build assertions -> compute variance ->
# route exceptions -> emit OSCAL -> push to Scytale.
#
# Note the ordering: Scytale is LAST and it is a push. This repo produces the evidence; Scytale
# renders it for the auditor. See docs/adr/0001-scytale-is-a-sink.md.

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily, ahead of the US working day
  workflow_dispatch:

permissions:
  contents: read
  id-token: write         # OIDC to AWS. No long-lived keys in this pipeline — the pipeline that
                          # measures ctl.iam.cloud-platform.mfa does not get to violate it.

concurrency:
  group: ccm
  cancel-in-progress: false   # never cancel a partial collection; a truncated population is a lie

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@5579c002bb4778aa43395ef1df492868a9a1c83f # v4.0.2
        with:
          role-to-assume: ${{ secrets.CCM_READONLY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Collect full state
        env:
          IDP_TOKEN: ${{ secrets.IDP_READONLY_TOKEN }}
          GH_TOKEN: ${{ secrets.GRC_READONLY_TOKEN }}
        run: node src/cli.mjs collect --all

      - name: Build assertions and variance
        run: node src/cli.mjs assert

      # Denominator drift is checked BEFORE failures are routed. A population that silently
      # shrank makes the pass rate improve while coverage gets worse, and routing failures first
      # buries that signal under a list of tickets.
      - name: Denominator drift check
        run: node src/cli.mjs drift --tolerance 0.10

      - name: Route exceptions
        run: node src/cli.mjs route

      - name: Emit OSCAL assessment results
        run: npm run oscal

      - name: Push to Scytale
        env:
          SCYTALE_TOKEN: ${{ secrets.SCYTALE_TOKEN }}
          SCYTALE_URL: ${{ secrets.SCYTALE_CUSTOM_INTEGRATION_URL }}
        # Stays dry-run until the Custom Integration JSON contract is confirmed against the UI.
        # A guessed schema produces silently wrong evidence in the auditor-facing system, which is
        # strictly worse than no evidence. src/push/scytale.mjs refuses to send until then.
        run: node src/cli.mjs push

      - name: Commit the evidence record
        run: |
          git config user.name  "ccm-bot"
          git config user.email "ccm-bot@reco.ai"
          git add out/ evidence/
          git diff --staged --quiet || git commit -m "ccm: $(date -u +%Y-%m-%d)"
          git push
