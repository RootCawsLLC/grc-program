name: ci

# Every third-party action is pinned to a full commit SHA, not a tag.
#
# In March 2026 an attacker force-pushed 76 of 77 tags in aquasecurity/trivy-action to malicious
# commits carrying an infostealer that harvested AWS, GCP and Azure credentials, SSH keys and
# kubeconfigs from CI runners (GHSA-69fq-xp46-6x23, CVE-2026-33634). Tag immutability did not prevent it.
#
# Pins verified against the upstream repositories on 2026-08-21 via
# `gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq '.object.sha'`.
# One of the three was originally wrong — a plausible-looking SHA that pointed at nothing — which
# is exactly the failure mode this practice exists to prevent. Re-verify on every version bump;
# never take a pin on trust, including from this file's own history.
#
# This pipeline holds read credentials to the identity provider, the cloud estate and the source
# repositories. It is a higher-value target than the product build. Treat it accordingly.

on:
  pull_request:
  push: { branches: [main] }

permissions:
  contents: read          # least privilege by default; jobs escalate only where they must

jobs:
  control-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci

      # Schema plus guards. The guards are the part that matters: they are the rules this repo
      # refuses to break, expressed as an exit code rather than as a paragraph in a runbook.
      - name: Validate control inventory
        run: npm run validate

      - name: Test
        run: npm test

      # Determinism gate, over the WHOLE package rather than one document. If an unchanged
      # inventory produces a different OSCAL package, the deterministic-UUID contract is broken and
      # every downstream diff becomes unreviewable.
      #
      # This used to cover assessment-results alone, which was the only artifact that existed. It
      # would have passed happily while a non-deterministic catalog, profile, SSP or POA&M sat
      # beside it.
      - name: OSCAL determinism
        run: |
          npm run emit -- --out /tmp/oscal-first
          npm run emit -- --out /tmp/oscal-second
          diff -ru /tmp/oscal-first /tmp/oscal-second \
            || { echo "::error::OSCAL export is not deterministic. A random UUID or a timestamp leaked into an emitter."; exit 1; }

  # Schema conformance is checked by the real OSCAL CLI, not asserted in a README. The `oscal` npm
  # package bootstraps the Java CLI (oscal-cli-enhanced 3.2.0) from Maven Central, hence setup-java.
  #
  # BLOCKING. Nothing here is piped through `|| true` except the bootstrap step, whose file is then
  # validated again for real in the loop below. Reference implementations of this gate have shipped
  # with `|| true` on the validation itself, or against a package name that does not exist on npm,
  # and reported green while validating nothing — the precise failure mode this repository exists
  # to argue against.
  #
  # All 17 documents validate clean as of 2026-08-22, so this gate can fail the build and a
  # regression in any emitter now stops a merge.
  oscal-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with: { node-version: '22', cache: 'npm' }
      # Pin verified 2026-08-22 against actions/setup-java tag v4.7.1 via
      # `gh api repos/actions/setup-java/git/ref/tags/v4.7.1 --jq '.object.sha'`.
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with: { distribution: temurin, java-version: '17' }
      - run: npm ci
      - run: npm run emit

      # The npm wrapper downloads the Java CLI on first use and exits WITHOUT validating that first
      # file, so whichever document came first in the loop would silently produce no result. This
      # step absorbs the bootstrap; every file including this one is validated for real below, so
      # the `|| true` here hides nothing.
      - name: Bootstrap the OSCAL CLI
        run: npx --yes oscal@2.0.7 validate --file out/oscal-catalog.json || true

      - name: Validate every document against the OSCAL schemas
        run: |
          failed=0
          for f in out/*.json; do
            echo "::group::oscal validate $f"
            if npx --yes oscal@2.0.7 validate --file "$f" 2>&1 | tee /tmp/oscal-out | grep -q 'is valid\.'; then
              echo "PASS $f"
            else
              echo "::error file=$f::OSCAL schema validation failed"
              cat /tmp/oscal-out
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

  # Active testing, in CI, against a real running agent. Not a mock of a probe — the probe itself,
  # attacking proofplane's instrumented target twice: guardrails on, then guardrails off.
  #
  # The pass condition is NOT "the probes reported HELD". A broken probe reports HELD. It is that
  # every probe DISCRIMINATES: the guarded run holds AND the unguarded run breaches. Two of these
  # three probes reported HELD-on-both or an inverted result on their first live run, and both were
  # bugs in the probes. Gating on HELD alone would have shipped a control that tests nothing.
  agent-probes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci

      # The target is a separate public repository and is NOT vendored here. Pinned by SHA like
      # every other action; see THIRD-PARTY-NOTICES.md for why the two repos are kept apart.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: RootCawsLLC/proofplane
          path: .proofplane
          ref: main

      - name: Build the probe target
        working-directory: .proofplane/target
        run: npm install && npm run build

      - name: Start the target, guarded and unguarded
        working-directory: .proofplane/target
        run: |
          PORT=8091 PROOFPLANE_GUARDRAILS=all  node dist/server.js &
          PORT=8092 PROOFPLANE_GUARDRAILS=none node dist/server.js &
          for port in 8091 8092; do
            for i in $(seq 1 30); do
              curl -sf "http://127.0.0.1:$port/audit" >/dev/null && break
              [ "$i" = 30 ] && { echo "::error::target on $port never came up"; exit 1; }
              sleep 1
            done
          done

      - name: Run the probes
        run: npm run probe -- --guarded http://127.0.0.1:8091 --unguarded http://127.0.0.1:8092 --trials 3

      # The real gate. Every probe must discriminate; none may be VOID; the chain must verify.
      - name: Every probe must distinguish a working control from a missing one
        run: npm run probe:check

  policy-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Refuse framework text in the repository
        # ADR-0003. SCF is CC BY-ND 4.0 and its terms explicitly prohibit AI-assisted generation of
        # derivative content. We carry identifiers and resolve text at runtime from a local release.
        # This grep is the enforcement, not the ADR.
        run: |
          if grep -rInE '^\s*(description|requirement_text|control_text)\s*:' controls/ reference/ 2>/dev/null; then
            echo "::error::Framework text found in the control inventory. Carry identifiers only — see docs/adr/0003-no-framework-text.md"
            exit 1
          fi
          echo "No framework text present."
