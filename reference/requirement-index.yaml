# Requirement index — IDENTIFIERS ONLY.
#
# No requirement text appears here and none ever will. ADR-0003: SCF is CC BY-ND with an explicit
# AI-derivatives prohibition, and ISO standard text is separately licensed per user. Anyone reading
# this needs their own licensed copy of the standard, which they needed anyway.
#
# This file exists to give `grc gap --direction coverage` a denominator. Without it, "we have no
# coverage gaps" means "we did not look".
#
# in_scope is the ONLY editable field. Set it from the actual Statement of Applicability and the
# actual SOC 2 report scope during week-1 intake. The defaults below are deliberately null, not
# true — asserting a control is in scope before reading the SoA is how a coverage number becomes
# fiction.

soc2_tsc_2017:
  revision: "2017 criteria, with revised points of focus (2022)"
  note: >
    Common Criteria plus Availability and Confidentiality. Reco's trust center evidences an
    Availability commitment (published RTO/RPO) and a Confidentiality commitment; confirm the
    actual TSC categories in scope against the report cover page during intake. Processing
    Integrity and Privacy are NOT included below because there is no public signal they are in
