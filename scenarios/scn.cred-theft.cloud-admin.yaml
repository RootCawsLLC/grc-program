scenario_id: scn.cred-theft.cloud-admin
statement: >
  An external actor obtains a long-lived AWS access key or an unprotected console credential for a principal in the production organization and acts within the production cloud environment.
asset: "the organization AWS production environment"
threat_actor: "external financially-motivated actor"
effect: confidentiality
estimation_level: tef-vuln
estimation_rationale: >
  Decomposed to TEF and Susceptibility because the credential-report telemetry gives a clean, continuously measured Susceptibility denominator, and because the control decision (kill static keys vs. add detection) turns on which factor dominates.
