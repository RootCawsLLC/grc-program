scenario_id: scn.ai.undisclosed-subprocessor
statement: >
  Customer data is processed by a model provider or third party that does not appear in the published subprocessor register, and a customer or supervisory authority identifies the discrepancy.
asset: "customer personal data and the accuracy of the organization's published disclosures"
threat_actor: "regulator or customer exercising audit rights"
effect: confidentiality
estimation_level: lef
estimation_rationale: >
  Loss here is overwhelmingly secondary — regulatory response, contractual breach, and remediation of the disclosure — not primary data loss. Estimate at LEF; magnitude decomposes into FAIR-MAM response and fines/judgements modules.
