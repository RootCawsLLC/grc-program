scenario_id: scn.cred-theft.saas-admin
statement: >
  A financially motivated external actor obtains valid credentials for a Reco workforce identity holding administrative rights in a business SaaS application, and uses them to access data held in that application.
asset: "Reco corporate SaaS data"
threat_actor: "external financially-motivated actor"
effect: confidentiality
estimation_level: lef
estimation_rationale: >
  LEF is estimable directly from IdP authentication telemetry plus published credential-attack base rates. Decomposing to TEF and Susceptibility adds no decision-relevant precision at this stage.
