scenario_id: scn.availability.prod-data-loss
statement: >
  Production data becomes unavailable or is lost, and restoration exceeds the recovery time committed in customer agreements.
asset: "the organization production data stores and contractual availability commitments"
threat_actor: "non-malicious operational failure"
