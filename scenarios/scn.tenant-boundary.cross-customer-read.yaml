scenario_id: scn.tenant-boundary.cross-customer-read
statement: >
  A customer tenant, or an actor authenticated into one tenant, reads data belonging to a different customer tenant through a product API authorisation defect.
asset: "customer SaaS configuration and identity data held in the product platform"
threat_actor: "authenticated tenant or actor with tenant credentials"
effect: confidentiality
estimation_level: lef
estimation_rationale: >
  Highest-consequence scenario in the inventory. Frequency is low and poorly evidenced; magnitude is dominated by secondary loss (notification, contractual penalty, churn across the customer base, not only the affected tenant). Estimate at LEF and put the effort into magnitude.
